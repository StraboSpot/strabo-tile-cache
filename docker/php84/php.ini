; StraboTiles (web and the cmdlinezip.php background job)
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
file_uploads = Off
post_max_size = 1M
allow_url_fopen = Off
allow_url_include = Off
session.upload_progress.enabled = 0
; exec stays: asynczip.php starts cmdlinezip.php, the zip builder runs ln/du/zip (all arguments quoted)
disable_functions = system,shell_exec,passthru,proc_open,popen,pcntl_exec,dl,putenv,mail
open_basedir = /srv/app/www:/tileData:/tmp
memory_limit = 1G
