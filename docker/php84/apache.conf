<VirtualHost *:80>
    ServerName tiles.strabospot.org
    DocumentRoot /srv/app/www

    # Tiles are fetched by browsers and the field apps from other origins
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "POST, GET, OPTIONS, DELETE, PUT"
    Header always set Access-Control-Max-Age "1000"
    Header always set Access-Control-Allow-Headers "x-requested-with, Content-Type, origin, authorization, accept, client-security-token"

    <Directory "/">
        AllowOverride None
        Require all denied
    </Directory>

    <Directory "/srv/app/www/">
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        AcceptPathInfo Off

        RewriteEngine On
        # every OPTIONS (CORS preflight) answers 200, as before
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^ - [R=200,L]
        # the URL scheme the apps use (was www/.htaccess, plus MultiViews for the extensionless names)
        RewriteRule ^v4/(.*)$ tcache.php?cruft=$1 [L]
        RewriteRule ^v5/(.*)$ singletile.php?cruft=$1 [L]
        RewriteRule ^asyncstatus/(.*)$ astatus.php?uid=$1 [L]
        RewriteRule ^(asynczip|zipcount|zip|astatus|tcache|singletile)$ $1.php [L]
    </Directory>

    # Only these scripts are web pages; the rest of the tree is code, config or tools
    <LocationMatch "^/(docker|Classes|vendor|html)(/|$)|^/(cmdlinezip|pzipcount|test|db|zipinput|ez_sql_[a-z]+)\.php$|^/(composer\.(json|lock|phar)|config\.inc\.(php|template)|zipCount\.(js|py)|README\.md|LICENSE)$">
        Require all denied
    </LocationMatch>

    # Cached tiles and finished zips are files, never scripts (both are links into the /tileData mount)
    <Directory "/srv/app/www/cache/">
        php_admin_flag engine off
    </Directory>
    <Directory "/srv/app/www/ziptemp/">
        php_admin_flag engine off
    </Directory>
    <Directory "/tileData/">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        php_admin_flag engine off
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
