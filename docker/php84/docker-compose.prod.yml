# StraboTiles on the prod host (~/DC/StraboTiles/docker-compose.yml) after the PHP 8.4 port.
# Format 2.4: the host has docker-compose 1.25. Same container names and ports as before (the host Apache proxies
# tiles.strabospot.org to 127.0.0.1:8087), but nothing is published on the public interfaces any more.
version: '2.4'
services:
  tiles-php:
    image: tiles-php84
    container_name: tiles-php
    volumes:
      - ./www:/srv/app/www:ro
      - /volumes/volume01/StraboData/tileData:/tileData
    networks:
      - tiles_conn
    ports:
      - '127.0.0.1:8087:80'
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run/apache2
      - /var/run/apache2
      - /var/lock/apache2
      - /var/log/apache2
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
  tiles-postgres:
    build:
      context: .
      dockerfile: docker/postgresDockerfile
    shm_size: 1g
    image: tiles-postgres
    container_name: tiles-postgres
    volumes:
      - ./postgresql:/var/lib/postgresql/data
      - ./export_data:/export_data
    networks:
      - tiles_conn
    # was '5437:5432' (all interfaces)
    ports:
      - '127.0.0.1:5437:5432'
    env_file: ./dbconfig/db_config_inc.txt
    restart: always
networks:
  tiles_conn:
    driver: bridge
